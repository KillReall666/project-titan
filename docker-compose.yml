version: "3.9"

services:
  auth:
    build: .
    container_name: auth-service
    ports:
      - "8080:1489"
    environment:
      RUN_ADDRESS: ":1489"
      DATABASE_URL: "host=db port=5432 user=postgres password=postgres dbname=auth_db sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: .

  db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pgdata: